[project]
name = "pyslam"
version = "2.10.8"
authors = [{ name = "Luigi Freda", email = "luigifreda@gmail.com" }]
maintainers = [{ name = "Luigi Freda", email = "luigifreda@gmail.com" }]
description = "pySLAM is a Python-based Visual SLAM pipeline that supports monocular, stereo, and RGB-D cameras. It offers a wide range of modern local and global features, multiple loop-closing strategies, a volumetric reconstruction pipeline, integration of depth prediction models, and semantic segmentation for enhanced scene understanding."
readme = "README.md"
requires-python = ">=3.11.9"
# Core: what the `default` level needs (main_vo, main_feature_matching, main_slam, main_map_viewer,
# main_slam_evaluation, dense reconstruction with TSDF). Lower bounds only, so that conda-forge / pixi
# packages satisfy them instead of pip replacing them with older pinned wheels. torch, torchvision,
# OpenCV and faiss come from conda-forge (or the install scripts), not from here.
# The optional extras follow the levels: depth, semantics, full (cumulative); tf (TensorFlow
# features, in their own env); dev.
dependencies = [
  "numpy>=1.24.3,<2",
  "scipy>=1.10.1",
  "matplotlib>=3.7.5",
  "seaborn>=0.13.2",
  "pandas",
  "scikit-image>=0.21.0",
  "scikit-learn",  # Patch-NetVLAD (NETVLAD loop detector); came in via sklearn-pandas before
  "networkx>=3.1",
  "imageio>=2.34.2",
  "pillow>=10.4.0",
  "h5py>=3.1.1",
  "pyyaml>=6.0.1",
  "hjson",
  "ujson",
  "munch",
  "yacs>=0.1.8",
  "configargparse",
  "ordered-set>=4.1.0",
  "termcolor>=2.4.0",
  "tqdm>=4.66.4",
  "psutil>=5.5.1",
  "packaging",
  "requests",
  "gdown",
  "jinja2",
  "six>=1.14.0",
  "typing_extensions",
  "numba",
  "evo",
  "trimesh",
  "plyfile",
  "open3d",  # dense reconstruction (TSDF / voxel grid), part of the default level
  "pyflann-py3; platform_system != 'Darwin'",  # loop_detector_database.py uses FLANN only off macOS
  "roma",
  "kornia>=0.8.2,<0.9",
  "kornia_moons>=0.2.9",
  "timm",
  "einops",
  "opt_einsum",
  "fast-pytorch-kmeans",
  "onnxruntime>=1.22.0",
  "tensorboard",  # imported by thirdparty/disk (DISK, LIGHTGLUE_DISK) at load time
  # viewers
  "pyqtgraph",
  "pyside6",
  "pyopengl>=3.1.7",
  "pygame>=2.6.0",
  "PyGLM",
  "rerun-sdk>=0.23,<0.23.2",  # set_time/Scalars need 0.23; from 0.23.2 rerun-sdk declares numpy>=2
  # datasets (ROS bags via mcap)
  "mcap",
  "mcap-ros1-support",
  "mcap-ros2-support",
]

[project.optional-dependencies]
# main_depth_prediction
depth = [
  "pillow_heif",
  "gradio",
]
# main_semantic_image_segmentation (on top of depth). Some backends need more packages
# (e.g. detectron2, open-clip-torch): see the semantics level in pixi.toml.
semantics = [
  "pyslam[depth]",
  "transformers",
  "ultralytics",
  "supervision",
]
# main_scene_from_views, Gaussian splatting (on top of semantics)
full = [
  "pyslam[semantics]",
  "lpips",
  "wandb",
  "rich",  # MonoGS
  "glfw",  # MonoGS GUI
]
# TensorFlow-based features (DELF, ContextDesc, LF-Net, GeoDesc, L2-Net Keras): TensorFlow itself is
# installed separately, in its own environment
tf = [
  "tf-slim==1.1.0",
  "Keras-Applications==1.0.8",
  "Keras-Preprocessing==1.1.2",
]
dev = [
  "pytest",
  "ruff",
  "rich",
]

[tool.setuptools]
packages = ["pyslam", "thirdparty"]

[tool.setuptools.package-dir]
pyslam = "pyslam"
thirdparty = "thirdparty"


[project.urls]
Repository = "https://github.com/luigifreda/pyslam"


[tool.black]
line-length = 100          # default 88; 100 or 120 are common in industry
target-version = ['py311']

# only format .py / .pyi files
include = '\.pyi?$'

# exclude dirs (regex; Black uses re.VERBOSE so whitespace/comments are OK)
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | logs
  | results
  | thirdparty/(?! (contextdesc|g2opy|geodesc|gtsam_factors|l2net|l2net_keras|lietorch|monogs|mvdust3r_scripts|orbslam2_features|pangolin|pybind11|pydbow2|pydbow3|pyibow|ros2_pybindings) (?:/|$) )
)/
'''
